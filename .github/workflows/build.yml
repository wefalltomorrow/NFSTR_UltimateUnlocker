name: Build selective ASI

on:
  push:
    branches:
      - master
      - selective-promo-dlc
      - selective-promo-dlc-test2
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        shell: pwsh
        run: |
          msbuild .\NFSTR_UltimateUnlocker.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Collect ASI
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter NFSTR_UltimateUnlocker.asi |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1

          if (-not $asi) {
            throw 'Release NFSTR_UltimateUnlocker.asi was not produced.'
          }

          $outName = if ($env:GITHUB_REF_NAME -eq 'selective-promo-dlc-test2') {
            'NFSTR_SelectiveUnlocker_test2.asi'
          } else {
            'NFSTR_SelectiveUnlocker.asi'
          }

          Copy-Item $asi.FullName "$env:GITHUB_WORKSPACE\$outName" -Force
          $hash = (Get-FileHash "$env:GITHUB_WORKSPACE\$outName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $outName" | Set-Content "$env:GITHUB_WORKSPACE\$outName.sha256.txt"

          "OUT_NAME=$outName" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Built: $($asi.FullName)"
          Write-Host "Output: $outName"
          Write-Host "SHA-256: $hash"

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: NFSTR-SelectiveUnlocker-${{ github.ref_name }}
          path: |
            ${{ env.OUT_NAME }}
            ${{ env.OUT_NAME }}.sha256.txt
          if-no-files-found: error
