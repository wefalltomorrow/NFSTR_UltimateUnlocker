name: Publish release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and check release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if (-not $version) {
            throw 'VERSION is empty.'
          }

          $tag = "v$version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            "RELEASE_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Release $tag already exists; nothing to publish."
          }
          else {
            "RELEASE_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Release $tag does not exist; publishing it from this commit."
          }

      - name: Set up MSBuild
        if: env.RELEASE_EXISTS != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          msbuild .\NFSTR_UltimateUnlocker.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Prepare release assets
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter NFSTR_UltimateUnlocker.asi |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1

          if (-not $asi) {
            throw 'Release NFSTR_UltimateUnlocker.asi was not produced.'
          }

          $outName = 'NFSTR_SelectiveUnlocker.asi'
          $outPath = Join-Path $env:GITHUB_WORKSPACE $outName
          Copy-Item $asi.FullName $outPath -Force

          $hash = (Get-FileHash $outPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $outName" | Set-Content "$outPath.sha256.txt"

          $notes = Get-Content .\RELEASE_NOTES.md -Raw
          $notes += "`r`n`r`n## SHA-256`r`n`r`n``$hash`` — ``$outName`` `r`n"
          Set-Content .\release-notes-generated.md $notes

          Write-Host "Release asset: $outName"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub release
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            .\NFSTR_SelectiveUnlocker.asi `
            .\NFSTR_SelectiveUnlocker.asi.sha256.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "NFSTR Selective Promo/DLC Unlocker $env:TAG" `
            --notes-file .\release-notes-generated.md `
            --latest
