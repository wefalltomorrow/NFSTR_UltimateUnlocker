name: Publish release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version and check release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if (-not $version) {
            throw 'VERSION is empty.'
          }

          $tag = "v$version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            "RELEASE_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Release $tag already exists; nothing to publish."
          }
          else {
            "RELEASE_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Release $tag does not exist; publishing it from this commit."
          }

      - name: Set up MSBuild
        if: env.RELEASE_EXISTS != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          msbuild .\NFSTR_UltimateUnlocker.sln /m /p:Configuration=Release /p:Platform=x86

      - name: Prepare release package
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter NFSTR_UltimateUnlocker.asi |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1

          if (-not $asi) {
            throw 'Release NFSTR_UltimateUnlocker.asi was not produced.'
          }

          $packageName = "NFSTR_UltimateUnlocker-v$env:VERSION.zip"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE $packageName
          $staging = Join-Path $env:RUNNER_TEMP 'NFSTR_UltimateUnlocker-package'

          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item $asi.FullName (Join-Path $staging 'NFSTR_UltimateUnlocker.asi') -Force
          Copy-Item .\NFSTR_UltimateUnlocker.ini (Join-Path $staging 'NFSTR_UltimateUnlocker.ini') -Force

          Compress-Archive -Path "$staging\*" -DestinationPath $packagePath -Force

          $hash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName" | Set-Content "$packagePath.sha256.txt"

          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Append

          $notes = Get-Content .\RELEASE_NOTES.md -Raw
          $notes += "`r`n`r`n## SHA-256`r`n`r`n``$hash`` - ``$packageName`` `r`n"
          Set-Content .\release-notes-generated.md $notes

          Write-Host "Release package: $packageName"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub release
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG `
            ".\$env:PACKAGE_NAME" `
            ".\$env:PACKAGE_NAME.sha256.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "NFSTR Ultimate Unlocker $env:TAG" `
            --notes-file .\release-notes-generated.md `
            --latest
