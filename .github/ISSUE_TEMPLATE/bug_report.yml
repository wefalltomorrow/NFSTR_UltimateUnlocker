name: Bug report
description: Report a problem with the unlocker
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Game version / executable
      description: Include the game version and executable hash if you know it.
      placeholder: "v1.1.0.0"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Unlock mode
      options:
        - DLC only (UnlockDLC=1, UnlockAll=0)
        - Unlock all (UnlockAll=1)
        - Other / custom settings
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can it be reproduced?
      description: List the steps if it's easy to reproduce.

  - type: textarea
    id: mods
    attributes:
      label: Other mods / ASIs
      description: List other installed mods if they might be relevant.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I am not loading another copy of NFSTR_UltimateUnlocker.asi at the same time.
          required: true
