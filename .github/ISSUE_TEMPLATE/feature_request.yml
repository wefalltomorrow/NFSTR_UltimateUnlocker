name: Feature / entitlement request
description: Propose another content entitlement or compatibility improvement
title: "[Request] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally avoids broad unlock-all behavior. Requests should identify a specific piece of content or compatibility problem and explain why it belongs in the selective scope.

  - type: input
    id: content
    attributes:
      label: Content / feature
      description: Name the exact car, pack, challenge series, entitlement, executable build or compatibility target.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include known OfferIds/SKUs, screenshots, runtime logs, executable hashes, historical release information or other evidence if available.
    validations:
      required: true

  - type: textarea
    id: progression
    attributes:
      label: Progression impact
      description: Explain what normal progression requirements must remain untouched.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is not a request to globally unlock all cars/stages/challenges.
          required: true
