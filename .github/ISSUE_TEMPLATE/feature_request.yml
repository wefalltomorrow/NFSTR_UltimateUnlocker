name: Feature request
description: Suggest an unlocker feature or compatibility improvement
title: "[Request] "
labels: []
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like added?
      description: Describe the feature, content or compatibility change.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would it be useful?
      description: A short explanation is enough.
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: Extra info
      description: Add screenshots, OfferIds, executable hashes, links or anything else that might help.
